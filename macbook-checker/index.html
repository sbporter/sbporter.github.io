<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>14" MacBook Pro Stock Checker</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --surface: #2a2a2a;
      --surface-hover: #333;
      --border: #444;
      --text: #e8e8e8;
      --text-muted: #999;
      --accent: #0071e3;
      --green: #30d158;
      --red: #ff453a;
      --yellow: #ffd60a;
      --pill-chip: #1c3a5e;
      --pill-chip-text: #5ac8fa;
      --pill-cpu: #3a2a1a;
      --pill-cpu-text: #ff9f0a;
      --pill-gpu: #2a1a3a;
      --pill-gpu-text: #bf5af2;
      --pill-ram: #1a3a2a;
      --pill-ram-text: #30d158;
      --pill-ssd: #3a3a1a;
      --pill-ssd-text: #ffd60a;
      --pill-nano: #4a3000;
      --pill-nano-text: #ffd60a;
      --pill-price: #3a3a3a;
      --pill-price-text: #e8e8e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 2rem 1rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header p {
      color: var(--text-muted);
      margin-top: 0.25rem;
      font-size: 0.95rem;
    }

    .controls {
      max-width: 600px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .controls label {
      font-size: 0.9rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .controls input {
      flex: 0 0 120px;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .controls input:focus {
      border-color: var(--accent);
    }

    .controls button {
      flex: 0 0 auto;
      padding: 0.5rem 1.25rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .controls button:hover { opacity: 0.85; }
    .controls button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-bar {
      text-align: center;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .status-bar.error { color: var(--red); }

    .results {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
    }

    .store-section { margin-bottom: 2rem; }

    .store-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .store-name { font-size: 1.2rem; font-weight: 600; }
    .store-addr { font-size: 0.85rem; color: var(--text-muted); }

    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 0.75rem;
    }

    .model-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      transition: background 0.15s;
    }

    .model-card:hover { background: var(--surface-hover); }

    .model-card.available {
      border-color: var(--green);
      border-width: 2px;
    }

    .model-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.5rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.55rem;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .pill-chip { background: var(--pill-chip); color: var(--pill-chip-text); }
    .pill-cpu { background: var(--pill-cpu); color: var(--pill-cpu-text); }
    .pill-gpu { background: var(--pill-gpu); color: var(--pill-gpu-text); }
    .pill-ram { background: var(--pill-ram); color: var(--pill-ram-text); }
    .pill-ssd { background: var(--pill-ssd); color: var(--pill-ssd-text); }
    .pill-nano { background: var(--pill-nano); color: var(--pill-nano-text); }
    .pill-price { background: var(--pill-price); color: var(--pill-price-text); }

    .model-status {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .model-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .model-status.avail .dot { background: var(--green); }
    .model-status.avail { color: var(--green); }
    .model-status.unavail .dot { background: var(--red); }
    .model-status.unavail { color: var(--red); }

    .delivery-section {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .delivery-section h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .delivery-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 0.5rem;
    }

    .delivery-card.next-day {
      border-color: var(--green);
      border-width: 2px;
    }

    .delivery-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .delivery-info {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .delivery-info.highlight {
      color: var(--green);
      font-weight: 500;
    }

    .filter-row {
      max-width: 1100px;
      margin: 0 auto 1rem;
      padding: 0 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      padding: 0.35rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover { border-color: var(--text-muted); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .timestamp {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 0.5rem;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--text-muted);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .summary-bar {
      max-width: 1100px;
      margin: 0 auto 1rem;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border-radius: 10px;
      display: flex;
      gap: 2rem;
      font-size: 0.9rem;
    }

    .summary-stat {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .summary-stat .count {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .summary-stat .label {
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .models-grid { grid-template-columns: 1fr; }
      .controls { flex-wrap: wrap; }
      .controls input { flex: 1 1 100px; }
      .summary-bar { flex-wrap: wrap; gap: 1rem; }
      .store-header { flex-direction: column; gap: 0.25rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>14" MacBook Pro Stock Checker</h1>
    <p>Check Apple Store pickup &amp; delivery availability</p>
  </div>

  <div class="controls">
    <label for="zip">Zip Code</label>
    <input type="text" id="zip" value="84009" maxlength="5" pattern="[0-9]{5}" placeholder="84009">
    <button id="checkBtn" onclick="checkStock()">Check Stock</button>
  </div>

  <div class="filter-row" id="filters" style="display:none;">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="available">Available Only</button>
    <button class="filter-btn" data-filter="m4">M4</button>
    <button class="filter-btn" data-filter="m4pro">M4 Pro</button>
    <button class="filter-btn" data-filter="m4max">M4 Max</button>
    <button class="filter-btn" data-filter="nano">Nano-texture</button>
  </div>

  <div class="status-bar" id="status"></div>
  <div class="summary-bar" id="summary" style="display:none;"></div>
  <div class="results" id="results"></div>
  <div class="timestamp" id="timestamp"></div>

<script>
const MODELS = [
  // M4 base - Standard display
  { part: "MW2U3LL/A", chip: "M4", cpu: "10-core CPU", gpu: "10-core GPU", ram: "16GB", storage: "512GB", color: "Space Black", display: "Standard", price: 1599, tier: "m4" },
  { part: "MW2W3LL/A", chip: "M4", cpu: "10-core CPU", gpu: "10-core GPU", ram: "16GB", storage: "512GB", color: "Silver", display: "Standard", price: 1599, tier: "m4" },
  { part: "MW2V3LL/A", chip: "M4", cpu: "10-core CPU", gpu: "10-core GPU", ram: "16GB", storage: "1TB", color: "Space Black", display: "Standard", price: 1799, tier: "m4" },
  { part: "MW2X3LL/A", chip: "M4", cpu: "10-core CPU", gpu: "10-core GPU", ram: "16GB", storage: "1TB", color: "Silver", display: "Standard", price: 1799, tier: "m4" },
  { part: "MCX04LL/A", chip: "M4", cpu: "10-core CPU", gpu: "10-core GPU", ram: "24GB", storage: "1TB", color: "Space Black", display: "Standard", price: 1899, tier: "m4" },
  { part: "MCX14LL/A", chip: "M4", cpu: "10-core CPU", gpu: "10-core GPU", ram: "24GB", storage: "1TB", color: "Silver", display: "Standard", price: 1899, tier: "m4" },
  // M4 base - Nano-texture display
  { part: "MXCM3LL/A", chip: "M4", cpu: "10-core CPU", gpu: "10-core GPU", ram: "24GB", storage: "1TB", color: "Space Black", display: "Nano-texture", price: 2049, tier: "m4" },
  { part: "MXCN3LL/A", chip: "M4", cpu: "10-core CPU", gpu: "10-core GPU", ram: "24GB", storage: "1TB", color: "Silver", display: "Nano-texture", price: 2049, tier: "m4" },
  // M4 Pro - Standard display
  { part: "MX2E3LL/A", chip: "M4 Pro", cpu: "12-core CPU", gpu: "16-core GPU", ram: "24GB", storage: "512GB", color: "Silver", display: "Standard", price: 1999, tier: "m4pro" },
  { part: "MX2H3LL/A", chip: "M4 Pro", cpu: "12-core CPU", gpu: "16-core GPU", ram: "24GB", storage: "512GB", color: "Space Black", display: "Standard", price: 1999, tier: "m4pro" },
  { part: "MX2F3LL/A", chip: "M4 Pro", cpu: "14-core CPU", gpu: "20-core GPU", ram: "24GB", storage: "1TB", color: "Silver", display: "Standard", price: 2399, tier: "m4pro" },
  { part: "MX2J3LL/A", chip: "M4 Pro", cpu: "14-core CPU", gpu: "20-core GPU", ram: "24GB", storage: "1TB", color: "Space Black", display: "Standard", price: 2399, tier: "m4pro" },
  // M4 Pro - Nano-texture display, 48GB, 2TB
  { part: "MXE63LL/A", chip: "M4 Pro", cpu: "14-core CPU", gpu: "20-core GPU", ram: "48GB", storage: "2TB", color: "Space Black", display: "Nano-texture", price: 2949, tier: "m4pro" },
  // M4 Max - Standard display
  { part: "MX2G3LL/A", chip: "M4 Max", cpu: "14-core CPU", gpu: "32-core GPU", ram: "36GB", storage: "1TB", color: "Silver", display: "Standard", price: 3199, tier: "m4max" },
  { part: "MX2K3LL/A", chip: "M4 Max", cpu: "14-core CPU", gpu: "32-core GPU", ram: "36GB", storage: "1TB", color: "Space Black", display: "Standard", price: 3199, tier: "m4max" },
];

// CORS proxy fallback chain
const PROXIES = [
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

let lastData = null;
let activeFilter = "all";

function setStatus(msg, isError) {
  const el = document.getElementById("status");
  el.innerHTML = msg;
  el.className = "status-bar" + (isError ? " error" : "");
}

function renderPills(model) {
  let pills = `<span class="pill pill-chip">${model.chip}</span>`;
  pills += `<span class="pill pill-cpu">${model.cpu}</span>`;
  pills += `<span class="pill pill-gpu">${model.gpu}</span>`;
  pills += `<span class="pill pill-ram">${model.ram}</span>`;
  pills += `<span class="pill pill-ssd">${model.storage}</span>`;
  if (model.display === "Nano-texture") {
    pills += `<span class="pill pill-nano">Nano-texture</span>`;
  }
  pills += `<span class="pill pill-price">$${model.price.toLocaleString()}</span>`;
  return pills;
}

async function fetchWithProxyFallback(appleUrl) {
  let lastErr;
  for (const proxyFn of PROXIES) {
    const proxyUrl = proxyFn(appleUrl);
    try {
      const resp = await fetch(proxyUrl);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();
      return JSON.parse(text);
    } catch (err) {
      lastErr = err;
      console.warn(`Proxy failed: ${err.message}, trying next...`);
    }
  }
  throw lastErr || new Error("All proxies failed");
}

async function checkStock() {
  const zip = document.getElementById("zip").value.trim();
  if (!/^\d{5}$/.test(zip)) {
    setStatus("Please enter a valid 5-digit zip code.", true);
    return;
  }

  const btn = document.getElementById("checkBtn");
  btn.disabled = true;
  btn.textContent = "Checking...";
  document.getElementById("results").innerHTML = "";
  document.getElementById("summary").style.display = "none";
  document.getElementById("filters").style.display = "none";
  setStatus('<span class="spinner"></span> Fetching availability from Apple...', false);

  const params = new URLSearchParams();
  MODELS.forEach((m, i) => params.set(`parts.${i}`, m.part));
  params.set("location", zip);
  params.set("searchNearby", "true");

  const appleUrl = `https://www.apple.com/shop/fulfillment-messages?${params.toString()}`;

  try {
    const data = await fetchWithProxyFallback(appleUrl);

    if (data.body && data.body.errorMessage) {
      throw new Error(data.body.errorMessage);
    }

    lastData = data;
    renderResults(data);
    document.getElementById("filters").style.display = "flex";
    document.getElementById("timestamp").textContent = `Last checked: ${new Date().toLocaleTimeString()}`;
    setStatus("", false);
  } catch (err) {
    console.error(err);
    setStatus(`Failed to fetch availability. Try refreshing or check Apple directly.`, true);
    renderDirectLinks(zip);
  }

  btn.disabled = false;
  btn.textContent = "Check Stock";
}

function getModelInfo(partNumber) {
  return MODELS.find(m => m.part === partNumber);
}

function renderResults(data) {
  const content = data.body.content;
  const stores = content.pickupMessage?.stores || [];
  const delivery = content.deliveryMessage || {};

  let totalAvailable = 0;
  let totalConfigs = 0;

  let html = "";

  stores.forEach(store => {
    const parts = store.partsAvailability || {};
    const cards = [];

    Object.entries(parts).forEach(([partNum, info]) => {
      const model = getModelInfo(partNum);
      if (!model) return;

      const isAvail = info.pickupDisplay === "available";
      const quote = info.pickupSearchQuote || (isAvail ? "Available for pickup" : "Currently unavailable");

      totalConfigs++;
      if (isAvail) totalAvailable++;

      cards.push({
        model,
        isAvail,
        quote,
        html: `
          <div class="model-card ${isAvail ? "available" : ""}" data-tier="${model.tier}" data-avail="${isAvail}" data-display="${model.display}">
            <div class="model-title">${model.color}</div>
            <div class="pill-row">${renderPills(model)}</div>
            <div class="model-status ${isAvail ? "avail" : "unavail"}">
              <span class="dot"></span>
              ${quote}
            </div>
          </div>
        `
      });
    });

    cards.sort((a, b) => {
      if (a.isAvail !== b.isAvail) return a.isAvail ? -1 : 1;
      return a.model.price - b.model.price;
    });

    if (cards.length > 0) {
      const addr = store.address || {};
      html += `
        <div class="store-section">
          <div class="store-header">
            <span class="store-name">${store.storeName}</span>
            <span class="store-addr">${addr.address || ""}, ${addr.city || store.city || ""}, ${addr.state || store.state || ""} ${addr.postalCode || ""}</span>
          </div>
          <div class="models-grid">
            ${cards.map(c => c.html).join("")}
          </div>
        </div>
      `;
    }
  });

  // Delivery section
  const deliveryCards = [];
  Object.entries(delivery).forEach(([partNum, info]) => {
    const model = getModelInfo(partNum);
    if (!model) return;

    const options = info.deliveryOptionMessages || [];
    const mainMsg = info.orderByDeliveryBy || "";
    const isNextDay = /tomorrow/i.test(mainMsg) || options.some(o => /tomorrow/i.test(o.deliveryOptionMessage || ""));

    deliveryCards.push({
      model,
      isNextDay,
      html: `
        <div class="delivery-card ${isNextDay ? "next-day" : ""}" data-tier="${model.tier}" data-display="${model.display}">
          <div class="delivery-title">${model.color}</div>
          <div class="pill-row">${renderPills(model)}</div>
          <div class="delivery-info ${isNextDay ? "highlight" : ""}">
            ${mainMsg || options.map(o => o.deliveryOptionMessage).join(", ") || "Check apple.com for delivery estimates"}
          </div>
        </div>
      `
    });
  });

  deliveryCards.sort((a, b) => {
    if (a.isNextDay !== b.isNextDay) return a.isNextDay ? -1 : 1;
    return a.model.price - b.model.price;
  });

  if (deliveryCards.length > 0) {
    html += `
      <div class="delivery-section">
        <h2>Home Delivery to ${document.getElementById("zip").value}</h2>
        ${deliveryCards.map(c => c.html).join("")}
      </div>
    `;
  }

  document.getElementById("results").innerHTML = html;

  const nextDayCount = deliveryCards.filter(c => c.isNextDay).length;
  document.getElementById("summary").innerHTML = `
    <div class="summary-stat">
      <span class="count" style="color:var(--green)">${totalAvailable}</span>
      <span class="label">available for pickup</span>
    </div>
    <div class="summary-stat">
      <span class="count">${totalConfigs - totalAvailable}</span>
      <span class="label">unavailable</span>
    </div>
    <div class="summary-stat">
      <span class="count" style="color:var(--yellow)">${nextDayCount}</span>
      <span class="label">next-day delivery</span>
    </div>
  `;
  document.getElementById("summary").style.display = "flex";
}

function renderDirectLinks(zip) {
  let html = '<div class="delivery-section"><h2>Check directly on Apple.com</h2>';
  MODELS.forEach(m => {
    const url = `https://www.apple.com/shop/product/${encodeURIComponent(m.part)}`;
    html += `
      <div class="delivery-card">
        <div class="delivery-title">
          <a href="${url}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;">${m.color}</a>
        </div>
        <div class="pill-row">${renderPills(m)}</div>
        <div class="delivery-info">Click to check on apple.com</div>
      </div>
    `;
  });
  html += "</div>";
  document.getElementById("results").innerHTML = html;
}

// Filter logic
document.getElementById("filters").addEventListener("click", (e) => {
  if (!e.target.classList.contains("filter-btn")) return;

  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  activeFilter = e.target.dataset.filter;

  document.querySelectorAll(".model-card, .delivery-card").forEach(card => {
    const tier = card.dataset.tier;
    const avail = card.dataset.avail;
    const display = card.dataset.display;
    let show = true;

    if (activeFilter === "available") {
      show = avail === "true";
    } else if (activeFilter === "nano") {
      show = display === "Nano-texture";
    } else if (activeFilter !== "all") {
      show = tier === activeFilter;
    }

    card.style.display = show ? "" : "none";
  });
});

// Auto-check on load
window.addEventListener("DOMContentLoaded", () => checkStock());

// Enter key triggers check
document.getElementById("zip").addEventListener("keydown", (e) => {
  if (e.key === "Enter") checkStock();
});
</script>
</body>
</html>
